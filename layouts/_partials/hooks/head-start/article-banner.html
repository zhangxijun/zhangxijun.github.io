{{- /*
  文章顶部 banner（featured image）对齐修正。
  主题给 wrapper 设了 max-width:720px + margin:0 auto，但在中等宽度下父容器
  有额外内边距，导致图片看起来偏右、左右留白不对称。
  这里统一成：宽度跟随正文列、水平居中、圆角裁切。
*/ -}}
{{- if eq .Section "blog" -}}
<style>
  .featured-image-wrapper.article-header{
    width:100%!important;
    max-width:100%!important;
    max-height:none!important;
    margin-left:auto!important;
    margin-right:auto!important;
    text-align:center;
  }
  .featured-image-wrapper.article-header > div{width:100%}
  .featured-image-wrapper.article-header img.featured-image{
    width:100%!important;
    max-width:100%!important;
    height:auto!important;
    display:block;
    margin:0 auto;
    border-radius:14px;
  }
  .featured-image-wrapper.article-header .article-header-caption{display:block;text-align:center;margin-top:.6rem;font-size:.85rem;color:#64748b}
</style>
{{- end -}}
