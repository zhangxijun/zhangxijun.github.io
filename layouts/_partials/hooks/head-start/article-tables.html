{{- /*
  正文表格美化：只注入到 /blog/ 下、正文里真的带 Markdown 表格的页面。
  为什么放在 head hook：正文渲染前就加载好样式，避免闪烁；也避免 RSS 抢先渲染
  把去重标记用掉（Hugo 多输出格式的老问题）。
  深色模式用站点自己的 .dark 类，不用 prefers-color-scheme —— 否则系统是深色、
  页面却是浅色时，表格会变成深色（Edge 下就出现过这个错乱）。
*/ -}}
{{- if and (eq .Section "blog") (in .RawContent "| ---") -}}
<style>
  .prose table{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border:1px solid #d6f2e6;border-radius:16px;overflow:hidden;margin:1.9rem 0;font-size:14.8px;line-height:1.5;font-variant-numeric:tabular-nums;box-shadow:0 6px 20px rgba(6,78,59,.07)}
  .prose thead th{background:#065f46;color:#fff;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:13px 14px;border:0;text-align:left;vertical-align:middle;line-height:1.35}
  .prose thead th:first-child{background:#054a37}
  .prose thead th a{color:#fff!important;text-decoration:none;border-bottom:1px dotted rgba(255,255,255,.5)}
  .prose thead th a:hover{color:#d1fae5!important;border-bottom-color:#d1fae5}
  .prose tbody td{padding:13px 14px;background:#fff;border-bottom:1px solid #eef4f1;color:#3f4a53;font-size:14.5px;vertical-align:middle}
  .prose tbody td:first-child{background:#f7fdfa;font-weight:700;color:#0b3b2e;white-space:nowrap}
  .prose tbody tr:nth-child(even) td{background:#f6fbf9}
  .prose tbody tr:nth-child(even) td:first-child{background:#f0faf6}
  .prose tbody tr:hover td{background:#f1fbf6}
  .prose tbody tr:last-child td{border-bottom:0}
  .prose tbody td a{color:#047857;font-weight:600;text-decoration:none;border-bottom:1px solid #a7f3d0}
  .prose tbody td a:hover{color:#065f46;border-bottom-color:#059669}
  @media (max-width:640px){
    .prose table{display:block;overflow-x:auto;white-space:nowrap;font-size:13.5px;border-radius:12px}
    .prose thead th,.prose tbody td{padding:11px 12px}
    .prose thead th:first-child,.prose tbody td:first-child{position:sticky;left:0;z-index:1;box-shadow:1px 0 0 #eef4f1}
  }
  .dark .prose table{background:#0f1b17;border-color:#1f3d33;box-shadow:none}
  .dark .prose thead th{background:#0b3b2e;color:#d1fae5}
  .dark .prose thead th:first-child{background:#082e24}
  .dark .prose thead th a{color:#d1fae5!important;border-bottom-color:rgba(209,250,229,.5)}
  .dark .prose tbody td{background:#0f1b17;border-bottom-color:#1b2f28;color:#cbd5e1}
  .dark .prose tbody td:first-child{background:#12241d;color:#e2e8f0;box-shadow:none}
  .dark .prose tbody tr:nth-child(even) td{background:#12201b}
  .dark .prose tbody tr:nth-child(even) td:first-child{background:#152a22}
  .dark .prose tbody tr:hover td{background:#16302a}
  .dark .prose tbody td a{color:#6ee7b7;border-bottom-color:#065f46}
</style>
{{- end -}}
