{{- /*
  促销卡片的样式与脚本，统一从 <head> 注入。
  为什么不用短代码内联：Hugo 会为同一个页面生成多种输出（RSS 等），
  内联 + Scratch 去重会先被 RSS 吃掉，导致 HTML 页面反而没有样式。
  这里按「是否属于 deals 分区 / 是否用了促销短代码」判断，每个页面输出一份。
*/ -}}
{{- $needDeal := or (eq .Section "deals") (.HasShortcode "deal-feed") (.HasShortcode "deal-picks") -}}
{{- if $needDeal -}}
<style>
  /* ===== 促销一行式卡片（列表页 + 文章内促销卡） ===== */
  .deal-feed{display:flex;flex-direction:column;gap:14px;margin:1.5rem 0}
  .deal-feed a{text-decoration:none}
  .dl-card{display:flex;gap:18px;padding:18px;border:1px solid #e5e7eb;border-radius:14px;background:#fff;transition:box-shadow .2s ease}
  .dl-card:hover{box-shadow:0 8px 22px rgba(17,24,39,.08)}
  .dl-thumb{flex:0 0 160px;width:160px;height:160px;border-radius:10px;overflow:hidden;background:#fff7ed;display:flex;align-items:center;justify-content:center;border:1px solid #f1f5f9}
  .dl-thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .dl-body{flex:1;min-width:0}
  .dl-head{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:8px}
  .dl-badge{flex:none;font-size:13px;font-weight:800;letter-spacing:.02em;color:#dc2626;background:#fee2e2;border-radius:4px;padding:2px 8px;line-height:1.5}
  .dl-title{margin:0!important;font-size:20px!important;line-height:1.4!important;font-weight:700!important;color:#111827!important}
  .dl-title a{color:#111827!important}
  .dl-title a:hover{color:#dc2626!important}
  .dl-desc{margin:4px 0 12px!important;font-size:15px!important;line-height:1.65!important;color:#6b7280!important}
  .dl-price{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
  .dl-now{font-size:19px;font-weight:800;color:#dc2626}
  .dl-was{font-size:14px;color:#9ca3af;text-decoration:line-through}
  .dl-chips{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 14px}
  .dl-code{display:inline-flex;align-items:center;gap:8px;border:1px dashed #dc2626;border-radius:6px;padding:5px 11px;font-size:14px;font-weight:700;color:#dc2626;background:#fff5f5}
  .dl-code em{font-style:normal;font-weight:600;color:#9ca3af;font-size:13px}
  .dl-timer{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:#dc2626}
  .dl-timer em{font-style:normal;color:#9ca3af;font-size:12px}
  .dl-products{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:0 0 14px;padding-bottom:12px;border-bottom:1px dashed #e5e7eb}
  .dl-prod{display:block}
  .dl-prod-img{width:100%;aspect-ratio:1/1;border-radius:10px;background:#fff;border:1px solid #f1f5f9;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .dl-prod-img img{width:100%;height:100%;object-fit:contain;padding:8px;display:block}
  .dl-prod-name{margin:6px 0 2px;font-size:13px;line-height:1.45;color:#111827;font-weight:600}
  .dl-prod-price{font-size:13px;font-weight:700;color:#dc2626}
  .dl-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .dl-meta{font-size:13px;color:#9ca3af}
  .dl-cta{display:inline-block;background:#f97316;color:#fff!important;font-size:15px;font-weight:700;padding:11px 24px;border-radius:999px;white-space:nowrap}
  .dl-cta:hover{background:#ea580c;color:#fff!important}

  /* ===== 商品推荐格子（3 列 / 手机 2 列） ===== */
  .dp-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:1.75rem 0}
  .dp-card{display:flex;flex-direction:column;background:#fff;border:1px solid #ececec;border-radius:10px;padding:12px;text-decoration:none!important;transition:box-shadow .2s ease,transform .2s ease}
  .dp-card:hover{box-shadow:0 6px 20px rgba(17,24,39,.10);transform:translateY(-2px)}
  .dp-img{display:flex;align-items:center;justify-content:center;aspect-ratio:1/1;background:#fff;border-radius:8px;overflow:hidden}
  .dp-img img{width:100%;height:100%;object-fit:contain;display:block}
  .dp-price{margin:10px 0 4px;font-size:17px;font-weight:800;color:#e4393c;line-height:1.3}
  .dp-price s{margin-left:6px;font-size:12px;font-weight:500;color:#a8a8a8}
  .dp-name{font-size:13px;line-height:1.5;font-weight:700;color:#1f2937;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .dp-meta{margin-top:auto;padding-top:8px;font-size:11px;color:#b0b0b0}

  @media (max-width:640px){
    .dl-card{flex-direction:column;gap:12px}
    .dl-thumb{flex:none;width:100%;height:220px}
    .dl-products{grid-template-columns:repeat(2,minmax(0,1fr))}
    .dl-cta{width:100%;text-align:center}
    .dp-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .dp-card{padding:8px}
    .dp-price{font-size:15px}
    .dp-name{font-size:12px}
  }
</style>
<script>
  // 倒计时：只对写了 data-ends（ISO 时间）的卡片生效；没有日期或已过期就整块隐藏
  document.addEventListener('DOMContentLoaded', function () {
    function pad(n) { return (n < 10 ? '0' : '') + n; }
    function render(el) {
      var end = new Date(el.getAttribute('data-ends')).getTime();
      if (isNaN(end)) { el.parentNode.style.display = 'none'; return; }
      var left = end - Date.now();
      if (left <= 0) { el.parentNode.style.display = 'none'; return; }
      var d = Math.floor(left / 86400000);
      var h = Math.floor((left % 86400000) / 3600000);
      var m = Math.floor((left % 3600000) / 60000);
      var s = Math.floor((left % 60000) / 1000);
      el.textContent = (d > 0 ? d + 'd ' : '') + pad(h) + ':' + pad(m) + ':' + pad(s);
    }
    var timers = [].slice.call(document.querySelectorAll('.dl-timer b[data-ends]'));
    if (!timers.length) return;
    timers.forEach(render);
    setInterval(function () { timers.forEach(render); }, 1000);
  });
</script>
{{- end -}}
