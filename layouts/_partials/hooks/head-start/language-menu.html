{{- /*
  语言下拉菜单定位修正。
  主题的做法：下拉 <ul> 是 position:fixed + inset auto auto 0 0，点击时用
  transform: translate3d(left, button.bottom - innerHeight + 40, 0) 定位，
  于是面板底部落在按钮下方 40px、面板向上撑开，头顶部分被导航栏盖住，
  第一个语言（中文）就看不见了。
  这里在主题逻辑跑完之后重算一次：让面板第一行与语言按钮顶边对齐，
  并把层级提到导航栏之上，保证三项都能看到。
*/ -}}
<script>
  (function () {
    // 把面板摆到按钮的左上角位置：第一行与按钮同高
    function placePanel(button) {
      var panel = button.nextElementSibling;
      if (!panel || panel.classList.contains('hidden')) return;
      var rect = button.getBoundingClientRect();
      var panelHeight = panel.offsetHeight;
      if (!panelHeight) return;

      // 面板是 fixed + bottom:0，translateY 需要反推：
      // 面板顶部 = innerHeight + translateY - 面板高度，令其等于按钮顶部
      var y = rect.top + panelHeight - window.innerHeight;
      var panelWidth = panel.offsetWidth;
      // 水平方向右对齐按钮，并保证不超出屏幕左右边缘
      var x = Math.min(rect.right - panelWidth, window.innerWidth - panelWidth - 8);
      x = Math.max(8, x);

      panel.style.transform = 'translate3d(' + x + 'px, ' + y + 'px, 0)';
      panel.style.zIndex = '60';
    }

    // 捕获阶段监听：一定早于主题的 click 处理，再用 setTimeout 排到它之后执行
    document.addEventListener('click', function (event) {
      var button = event.target.closest('[data-hb-language-chooser]');
      if (!button) return;
      setTimeout(function () { placePanel(button); }, 0);
    }, true);

    // 窗口尺寸变化时菜单若还开着，跟着重新定位
    window.addEventListener('resize', function () {
      var button = document.querySelector('[data-hb-language-chooser][data-state="open"]');
      if (button) placePanel(button);
    });
  })();
</script>
